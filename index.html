<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網站首頁影音</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100vw;
      height: 100svh;
      background: #000;
    }

    .video-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .page-actions {
      position: absolute;
      right: 28px;
      bottom: 92px;
      z-index: 2;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .page-link,
    .sound-toggle {
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 999px;
      padding: 12px 18px;
      color: #fff;
      background: transparent;
      font-size: 16px;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .page-link {
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 700;
    }

    .sound-toggle {
      position: absolute;
      right: 28px;
      bottom: 280px;
      z-index: 2;
      padding: 16px 24px;
      font-size: 18px;
    }

    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      main {
        display: grid;
        place-items: center;
      }

      .video-stage {
        width: 100vw;
        height: auto;
        aspect-ratio: 16 / 9;
        max-height: 100svh;
      }

      video {
        object-fit: contain;
      }

      .page-actions {
        right: max(14px, env(safe-area-inset-right));
        bottom: calc(max(14px, env(safe-area-inset-bottom)) + 64px);
        max-width: calc(100vw - 28px);
        gap: 10px;
      }

      .page-link,
      .sound-toggle {
        padding: 11px 16px;
        font-size: 15px;
      }

      .page-link {
        padding: 14px 18px;
        font-size: 17px;
      }

      .sound-toggle {
        right: max(14px, env(safe-area-inset-right));
        bottom: calc(max(14px, env(safe-area-inset-bottom)) + 66px);
        padding: 14px 22px;
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="video-stage">
      <video id="heroVideo" src="./網站首頁影音.mp4" autoplay muted loop playsinline controls></video>
      <nav class="page-actions" aria-label="頁面導覽">
        <a class="page-link" href="./page2.html#works">作品回顧</a>
        <a class="page-link" href="./page2.html#contact">聯絡我們</a>
      </nav>
      <button class="sound-toggle" id="soundToggle" type="button">開啟聲音</button>
    </div>
  </main>
  <script>
    const video = document.getElementById("heroVideo");
    const soundToggle = document.getElementById("soundToggle");

    soundToggle.addEventListener("click", async () => {
      video.muted = !video.muted;
      soundToggle.textContent = video.muted ? "開啟聲音" : "關閉聲音";

      if (!video.muted && video.paused) {
        await video.play();
      }
    });
  </script>
</body>
</html>
