<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網站首頁影音</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100vw;
      height: 100svh;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .sound-toggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 999px;
      padding: 12px 18px;
      color: #fff;
      background: rgba(0, 0, 0, .62);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      main {
        display: grid;
        place-items: center;
      }

      video {
        object-fit: contain;
      }

      .sound-toggle {
        right: max(14px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
        padding: 11px 16px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <video id="heroVideo" src="./網站首頁影音.mp4" autoplay muted loop playsinline controls></video>
    <button class="sound-toggle" id="soundToggle" type="button">開啟聲音</button>
  </main>
  <script>
    const video = document.getElementById("heroVideo");
    const soundToggle = document.getElementById("soundToggle");

    soundToggle.addEventListener("click", async () => {
      video.muted = !video.muted;
      soundToggle.textContent = video.muted ? "開啟聲音" : "關閉聲音";

      if (!video.muted && video.paused) {
        await video.play();
      }
    });
  </script>
</body>
</html>
