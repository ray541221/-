<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網站首頁影音</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100vw;
      height: 100svh;
      background: #000;
    }

    .video-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .page-actions {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .page-link {
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      padding: 12px 18px;
      color: rgba(255, 255, 255, .82);
      background: transparent;
      font-size: 16px;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .page-link {
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      main {
        display: grid;
        place-items: center;
      }

      .video-stage {
        width: 100vw;
        height: auto;
        aspect-ratio: 16 / 9;
        max-height: 100svh;
      }

      video {
        object-fit: contain;
      }

      .page-actions {
        top: auto;
        left: auto;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        max-width: calc(100vw - 28px);
        gap: 8px;
        justify-content: flex-end;
      }

      .page-link {
        border-color: rgba(255, 215, 0, .72);
        color: rgb(255, 215, 0) !important;
        padding: 9px 13px;
        font-size: 13px;
      }

      .page-link {
        padding: 9px 13px;
        font-size: 13px;
      }

    }
  </style>
</head>
<body>
  <main>
    <div class="video-stage">
      <video id="heroVideo" src="./網站首頁影音.mp4" autoplay muted loop playsinline controls></video>
      <nav class="page-actions" aria-label="頁面導覽">
        <a class="page-link" href="./page2.html#works">作品展示區</a>
        <a class="page-link" href="./page2.html#contact">聯絡我們</a>
      </nav>
    </div>
  </main>
</body>
</html>
