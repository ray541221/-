<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品回顧｜聯絡我們</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #161616;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(18px, 5vw, 56px);
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid #e8e8e8;
      backdrop-filter: blur(10px);
    }

    .brand {
      color: #111;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      color: #222;
      text-decoration: none;
      font-size: 15px;
    }

    section {
      padding: clamp(56px, 9vw, 110px) clamp(20px, 7vw, 90px);
    }

    .intro {
      min-height: 42svh;
      display: grid;
      align-content: center;
      border-bottom: 1px solid #ececec;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h1 {
      max-width: 760px;
      font-size: clamp(36px, 7vw, 82px);
    }

    h2 {
      font-size: clamp(28px, 4vw, 48px);
    }

    p {
      max-width: 720px;
      margin: 18px 0 0;
      color: #555;
      font-size: clamp(16px, 2vw, 19px);
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 30px;
    }

    .work-item {
      min-height: 220px;
      padding: 22px;
      border: 1px solid #e4e4e4;
      background: #fafafa;
    }

    .work-item strong {
      display: block;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .contact-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 32px;
      align-items: start;
      margin-top: 30px;
    }

    .contact-card {
      padding: 26px;
      border: 1px solid #e4e4e4;
      background: #fafafa;
    }

    .contact-card a {
      color: #111;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    footer {
      padding: 28px clamp(20px, 7vw, 90px);
      color: #666;
      border-top: 1px solid #ececec;
    }

    @media (max-width: 760px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .work-grid,
      .contact-box {
        grid-template-columns: 1fr;
      }

      .work-item {
        min-height: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./index.html">回首頁</a>
    <nav aria-label="頁面導覽">
      <a href="#works">作品回顧</a>
      <a href="#contact">聯絡我們</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>作品回顧與聯絡我們</h1>
      <p>精簡整理作品資訊，讓訪客可以快速瀏覽並留下合作需求。</p>
    </section>

    <section id="works">
      <h2>作品回顧</h2>
      <p>這裡可放置過往作品、活動紀錄、影片截圖或專案介紹。</p>
      <div class="work-grid">
        <article class="work-item">
          <strong>形象影片</strong>
          <span>品牌首頁主視覺與影音呈現。</span>
        </article>
        <article class="work-item">
          <strong>活動紀錄</strong>
          <span>現場拍攝、剪輯與宣傳素材。</span>
        </article>
        <article class="work-item">
          <strong>商業合作</strong>
          <span>客製化內容規劃與視覺整合。</span>
        </article>
      </div>
    </section>

    <section id="contact">
      <h2>聯絡我們</h2>
      <div class="contact-box">
        <p>歡迎留下合作需求、作品規劃或網站調整方向。可先把要放的文字、照片、影片或聯絡方式補齊。</p>
        <div class="contact-card">
          <span>聯絡信箱</span>
          <br>
          <a href="mailto:ray541221@gmail.com">ray541221@gmail.com</a>
        </div>
      </div>
    </section>
  </main>

  <footer>© 2026</footer>
</body>
</html>
