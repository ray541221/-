<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品展示區｜聯絡我們</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #161616;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 18px clamp(18px, 5vw, 56px);
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid #e8e8e8;
      backdrop-filter: blur(10px);
    }

    .brand {
      color: #111;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      position: absolute;
      right: clamp(18px, 5vw, 56px);
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      color: #222;
      text-decoration: none;
      font-size: 15px;
    }

    section {
      padding: clamp(56px, 9vw, 110px) clamp(20px, 7vw, 90px);
    }

    #works {
      padding-top: 18px;
    }

    .top-title {
      margin: 0;
      text-align: center;
    }

    .intro {
      min-height: 42svh;
      display: grid;
      align-content: center;
      border-bottom: 1px solid #ececec;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h1 {
      max-width: 760px;
      font-size: clamp(36px, 7vw, 82px);
    }

    h2 {
      font-size: clamp(28px, 4vw, 48px);
    }

    p {
      max-width: 720px;
      margin: 18px 0 0;
      color: #555;
      font-size: clamp(16px, 2vw, 19px);
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 30px;
    }

    .work-card {
      display: grid;
      gap: 12px;
      color: inherit;
      text-align: center;
      text-decoration: none;
    }

    .work-item {
      min-height: min(58svh, 560px);
      display: grid;
      place-items: center;
      padding: 22px;
      position: relative;
      overflow: hidden;
      border: 1px solid #d8d8d8;
      background: #fff;
      color: inherit;
      text-align: center;
      text-decoration: none;
    }

    .work-card strong {
      display: block;
      font-size: clamp(22px, 3vw, 36px);
      line-height: 1.25;
    }

    .work-cover {
      padding: 0;
    }

    .work-cover img {
      width: 100%;
      height: 100%;
      min-height: inherit;
      object-fit: cover;
      display: block;
    }

    .portfolio-group {
      margin-top: 28px;
    }

    .portfolio-group h3 {
      margin: 0 0 12px;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.25;
    }

    .real-estate-gallery,
    .commercial-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .real-estate-gallery img,
    .commercial-gallery img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #f4f4f4;
    }

    .contact-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 34px;
      align-items: start;
      margin-top: 0;
    }

    .contact-card {
      width: 100%;
      min-height: clamp(150px, 18vw, 220px);
      display: grid;
      place-items: center;
      gap: 10px;
      padding: clamp(30px, 5vw, 54px);
      border: 1px solid #e4e4e4;
      background: #fafafa;
      text-align: center;
    }

    .contact-card span {
      color: #222;
      font-size: clamp(26px, 3.5vw, 42px);
      font-weight: 800;
      line-height: 1.25;
    }

    .contact-heading {
      margin: 0 auto;
      color: #0abab5;
      font-size: clamp(33px, 4.5vw, 51px);
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
    }

    .contact-card a {
      color: #111;
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 700;
      text-decoration: none;
      line-height: 1.2;
      word-break: break-word;
    }

    footer {
      padding: 28px clamp(20px, 7vw, 90px);
      color: #666;
      border-top: 1px solid #ececec;
    }

    @media (max-width: 760px) {
      header {
        align-items: center;
        flex-direction: row;
      }

      #works {
        padding-inline: 12px;
      }

      #contact {
        padding-inline: 12px;
      }

      .work-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .contact-box {
        grid-template-columns: 1fr;
      }

      .work-item {
        min-height: clamp(190px, 36svh, 260px);
      }

      .work-card {
        gap: 8px;
      }

      .work-card strong {
        font-size: 16px;
      }

      .real-estate-gallery,
      .commercial-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2 class="top-title">作品展示區</h2>
    <a class="brand" href="./index.html">回首頁</a>
  </header>

  <main>
    <section id="works">
      <div class="work-grid">
        <a class="work-card" href="./房地產廣告行銷.html" aria-label="房地產廣告行銷">
          <span class="work-item work-cover">
            <img src="./assets/房地產廣告行銷封面.jpeg" alt="房地產廣告行銷封面">
          </span>
          <strong>房地產廣告行銷</strong>
        </a>
        <a class="work-card" href="./商業廣告行銷.html" aria-label="商業廣告行銷">
          <span class="work-item work-cover">
            <img src="./assets/商業廣告行銷封面.jpg" alt="商業廣告行銷封面">
          </span>
          <strong>商業廣告行銷</strong>
        </a>
      </div>
    </section>

    <section id="contact">
      <div class="contact-box">
        <p class="contact-heading">超脫創意設計：<br>價值與榮耀</p>
        <div class="contact-card">
          <span>超脫創意設計_聯絡信箱：</span>
          <br>
          <a href="mailto:ray541221@gmail.com">ray541221@gmail.com</a>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
