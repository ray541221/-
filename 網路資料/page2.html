<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品展示區｜聯絡我們</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #161616;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(18px, 5vw, 56px);
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid #e8e8e8;
      backdrop-filter: blur(10px);
    }

    .brand {
      color: #111;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      margin-left: auto;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      color: #222;
      text-decoration: none;
      font-size: 15px;
    }

    section {
      padding: clamp(56px, 9vw, 110px) clamp(20px, 7vw, 90px);
    }

    #works {
      padding-top: 18px;
    }

    .top-title {
      margin: 0;
    }

    .intro {
      min-height: 42svh;
      display: grid;
      align-content: center;
      border-bottom: 1px solid #ececec;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h1 {
      max-width: 760px;
      font-size: clamp(36px, 7vw, 82px);
    }

    h2 {
      font-size: clamp(28px, 4vw, 48px);
    }

    p {
      max-width: 720px;
      margin: 18px 0 0;
      color: #555;
      font-size: clamp(16px, 2vw, 19px);
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 30px;
    }

    .work-item {
      min-height: min(58svh, 560px);
      display: grid;
      place-items: center;
      padding: 22px;
      position: relative;
      overflow: hidden;
      border: 1px solid #d8d8d8;
      background: #fff;
      text-align: center;
    }

    .work-item strong {
      display: block;
      font-size: clamp(22px, 3vw, 36px);
      line-height: 1.25;
    }

    .work-cover {
      padding: 0;
    }

    .work-cover img {
      width: 100%;
      height: 100%;
      min-height: inherit;
      object-fit: cover;
      display: block;
    }

    .work-cover strong {
      position: absolute;
      left: 18px;
      bottom: 18px;
      padding: 10px 16px;
      color: #fff;
      background: rgba(0, 0, 0, .5);
    }

    .contact-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 32px;
      align-items: start;
      margin-top: 30px;
    }

    .contact-card {
      padding: 26px;
      border: 1px solid #e4e4e4;
      background: #fafafa;
    }

    .contact-heading {
      margin: 0 0 18px;
      color: #0abab5;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 800;
      line-height: 1.35;
    }

    .contact-card a {
      color: #111;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    footer {
      padding: 28px clamp(20px, 7vw, 90px);
      color: #666;
      border-top: 1px solid #ececec;
    }

    @media (max-width: 760px) {
      header {
        align-items: center;
        flex-direction: row;
      }

      .work-grid,
      .contact-box {
        grid-template-columns: 1fr;
      }

      .work-item {
        min-height: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2 class="top-title">{{作品展示區}}</h2>
    <a class="brand" href="./index.html">回首頁</a>
  </header>

  <main>
    <section id="works">
      <div class="work-grid">
        <div class="work-item work-cover" aria-label="房地產廣告行銷">
          <img src="./assets/房地產廣告行銷封面.jpeg" alt="房地產廣告行銷封面">
          <strong>房地產廣告行銷</strong>
        </div>
        <div class="work-item work-cover" aria-label="商業廣告行銷">
          <img src="./assets/商業廣告行銷封面.jpg" alt="商業廣告行銷封面">
          <strong>商業廣告行銷</strong>
        </div>
      </div>
    </section>

    <section id="contact">
      <div class="contact-box">
        <p class="contact-heading">超脫的創意設計：<br>賦予全方位商品的價值與榮耀</p>
        <div class="contact-card">
          <span>超脫創意設計_聯絡信箱：</span>
          <br>
          <a href="mailto:ray541221@gmail.com">ray541221@gmail.com</a>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
