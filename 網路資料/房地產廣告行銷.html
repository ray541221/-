    .viewer { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.94); }
    .viewer.open { display: flex; }
    .viewer-frame { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); aspect-ratio: 16 / 9; display: grid; place-items: center; }
    .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

    .viewer-close { top: 18px; right: 18px; width: 44px; height: 44px; font-size: 30px; line-height: 1; }
    .viewer-fullscreen { top: 18px; left: 18px; min-width: 92px; height: 44px; padding: 0 14px; font-size: 16px; font-weight: 700; }
    .viewer-prev, .viewer-next { top: 50%; width: 48px; height: 64px; transform: translateY(-50%); font-size: 42px; line-height: 1; }
    .viewer-prev { left: 18px; }
    .viewer-next { right: 18px; }
    @media (max-width: 760px) { header { align-items: center; } .gallery { grid-template-columns: 1fr; } .viewer-frame { width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; } }

    <button class="viewer-prev" type="button" aria-label="上一張">‹</button>

    </div>
    <button class="viewer-next" type="button" aria-label="下一張">›</button>

  <script>
    const images = [...document.querySelectorAll('.gallery img')];
    const viewer = document.querySelector('#viewer');
    const viewerImage = viewer.querySelector('img');
    const closeButton = viewer.querySelector('.viewer-close');
    const fullscreenButton = viewer.querySelector('.viewer-fullscreen');
    const prevButton = viewer.querySelector('.viewer-prev');
    const nextButton = viewer.querySelector('.viewer-next');
    let currentIndex = 0;

    function showImage(index) {
      currentIndex = (index + images.length) % images.length;
      const image = images[currentIndex];
      viewerImage.src = image.src;
      viewerImage.alt = image.alt;
    }

    function openViewer(index) {
      showImage(index);
      viewer.classList.add('open');
      viewer.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function requestViewerFullscreen() {
      if (viewer.requestFullscreen) {
        viewer.requestFullscreen().catch(() => {});
      }
    }

    function closeViewer() {
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    images.forEach((image, index) => image.addEventListener('click', () => openViewer(index)));
    closeButton.addEventListener('click', closeViewer);
    fullscreenButton.addEventListener('click', requestViewerFullscreen);
    prevButton.addEventListener('click', () => showImage(currentIndex - 1));
    nextButton.addEventListener('click', () => showImage(currentIndex + 1));
    viewer.addEventListener('click', (event) => {
      if (event.target === viewer) closeViewer();
    });
    document.addEventListener('keydown', (event) => {
      if (!viewer.classList.contains('open')) return;
      if (event.key === 'Escape') closeViewer();
      if (event.key === 'ArrowLeft') showImage(currentIndex - 1);
      if (event.key === 'ArrowRight') showImage(currentIndex + 1);
    });
  </script>
